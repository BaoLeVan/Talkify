# ============================================================
#  TALKIFY  Docker Compose (Development)
#
#  Chỉ chạy các service cần thiết cho giai đoạn đầu phát triển:
#    app       Spring Boot application
#    postgres  PostgreSQL 16   metadata (users, conversations)
#    mongodb   MongoDB 7       message store
#    redis     Redis 7         cache, presence, session
#
#  Kafka, MinIO, ELK, Jaeger, Prometheus sẽ thêm ở giai đoạn sau.
#
#  Lệnh:
#    docker compose up -d              # khởi động tất cả
#    docker compose up -d postgres mongodb redis   # chỉ infra (không build app)
#    docker compose logs -f app        # xem log app
#    docker compose down -v            # dừng và xóa volumes
# ============================================================

networks:
  talkify-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  kafka_data:

services:

  # 
  #  Spring Boot Application
  # 
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: talkify:latest
    container_name: talkify-app
    restart: no
    ports:
      - "8080:8080"
    environment:
      APP_ID_GENERATOR_WORKER_ID: 1
      SPRING_PROFILES_ACTIVE: docker

      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/talkify_db
      SPRING_DATASOURCE_USERNAME: talkify
      SPRING_DATASOURCE_PASSWORD: talkify

      # MongoDB
      SPRING_DATA_MONGODB_URI: mongodb://talkify:talkify@mongodb:27017/talkify_db?authSource=admin

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: talkify

      # Mail (Gmail: dùng App Password, bật 2FA trước)
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Kafka tunable params — overridable từ host env (dùng kafka-tune.sh)
      KAFKA_PRODUCER_ACKS:                  ${KAFKA_PRODUCER_ACKS:-1}
      KAFKA_PRODUCER_RETRIES:               ${KAFKA_PRODUCER_RETRIES:-3}
      KAFKA_PRODUCER_BATCH_SIZE:            ${KAFKA_PRODUCER_BATCH_SIZE:-16384}
      KAFKA_PRODUCER_BUFFER_MEMORY:         ${KAFKA_PRODUCER_BUFFER_MEMORY:-33554432}
      KAFKA_PRODUCER_COMPRESSION:           ${KAFKA_PRODUCER_COMPRESSION:-none}
      KAFKA_PRODUCER_LINGER_MS:             ${KAFKA_PRODUCER_LINGER_MS:-0}
      KAFKA_PRODUCER_MAX_IN_FLIGHT:         ${KAFKA_PRODUCER_MAX_IN_FLIGHT:-5}
      KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:    ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:-30000}
      KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:   ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:-120000}
      KAFKA_CONSUMER_MAX_POLL_RECORDS:      ${KAFKA_CONSUMER_MAX_POLL_RECORDS:-500}
      KAFKA_CONSUMER_FETCH_MIN_BYTES:       ${KAFKA_CONSUMER_FETCH_MIN_BYTES:-1}
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:     ${KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:-500}
      KAFKA_CONSUMER_SESSION_TIMEOUT_MS:    ${KAFKA_CONSUMER_SESSION_TIMEOUT_MS:-45000}
      KAFKA_CONSUMER_HEARTBEAT_MS:          ${KAFKA_CONSUMER_HEARTBEAT_MS:-3000}
      KAFKA_LISTENER_CONCURRENCY:           ${KAFKA_LISTENER_CONCURRENCY:-6}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - talkify-network

  # 
  #  PostgreSQL 16
  # 
  postgres:
    image: postgres:16-alpine
    container_name: talkify-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: talkify_db
      POSTGRES_USER: talkify
      POSTGRES_PASSWORD: talkify
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - talkify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkify -d talkify_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 
  #  MongoDB 7
  # 
  mongodb:
    image: mongo:7.0
    container_name: talkify-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: talkify
      MONGO_INITDB_ROOT_PASSWORD: talkify
      MONGO_INITDB_DATABASE: talkify_db
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - talkify-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 
  #  Redis 7
  # 
  redis:
    image: redis:7.2-alpine
    container_name: talkify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass talkify --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - talkify-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "talkify", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 
  #  Kafka (KRaft mode — no Zookeeper)
  # 
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: talkify-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"       # internal (app → kafka inside docker network)
      - "9094:9094"       # external (host machine tools: kafka-ui, CLI)
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"   # base64, fixed for dev
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - talkify-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s